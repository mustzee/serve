version: '3.8'

services:
  # Ollama backend (recommended for offline use)
  ollama:
    image: ollama/ollama:latest
    container_name: llm-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # For GPU support, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # LLM Serve API
  llm-serve:
    build: .
    container_name: llm-serve-api
    ports:
      - "8000:8000"
    environment:
      - LLM_BACKEND_TYPE=ollama
      - LLM_OLLAMA_BASE_URL=http://ollama:11434
      - LLM_DEFAULT_MODEL=llama2
      - LLM_HOST=0.0.0.0
      - LLM_PORT=8000
    depends_on:
      - ollama
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro

  # Load balancer (nginx) for scalability
  nginx:
    image: nginx:alpine
    container_name: llm-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - llm-serve
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local
